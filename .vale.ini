# Vale Configuration File
# Copy this file to your project directory as .vale.ini and customize as needed

# Path where Vale will store downloaded style packages
StylesPath = styles

# Packages to download and use (comma-separated)
# Vale will automatically download these on first use
Packages = Microsoft, proselint, write-good, alex, Joblint, Hugo, MDX, Google, https://github.com/vale-cli/Std/releases/latest/download/Std.zip,  https://github.com/jdkato/voices/releases/latest/download/Voices.zip

# Minimum alert level (suggestion, warning, error)
MinAlertLevel = suggestion

# Global settings for all files
[*]
# Base your linting on these style packages
BasedOnStyles = Vale, Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct
IgnoreWords = Petstore, Writage

# Additional format-specific settings
[*.{md,mdx}]
# Markdown-specific settings
BasedOnStyles = Vale, Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct

[*.{rst,rest}]
# reStructuredText-specific settings
BasedOnStyles = Vale, Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct

[*.adoc]
# AsciiDoc-specific settings
BasedOnStyles = Vale, Microsoft, Google, proselint, write-good, alex, Joblint, Std, Voices, Direct

# Common Vale Packages:
# - write-good: Checks for common writing issues (weasel words, passive voice, etc.)
# - proselint: General prose linting
# - Google: Google Developer Documentation Style Guide
# - Microsoft: Microsoft Writing Style Guide
# - RedHat: Red Hat Documentation Style Guide
# - alex: Catches insensitive, inconsiderate writing
# - Joblint: Checks for issues in job postings

# Std Library Rules (https://github.com/vale-cli/Std)
# Abbreviations
Std.Abbreviations.Acronyms = suggestion
Std.Abbreviations.Latin = suggestion

# DateTime
Std.DateTime.DateFormat = suggestion
Std.DateTime.TimeFormat = suggestion

# Grammar
Std.Grammar.Contractions = suggestion
Std.Grammar.PassiveVoice = suggestion

# Punctuation
Std.Punctuation.OxfordComma = warning
Std.Punctuation.Ellipses = suggestion
Std.Punctuation.Spacing = warning

# Readability
Std.Readability.SentenceLength = warning

# Usage
Std.Usage.FirstPersonSingular = suggestion
Std.Usage.FirstPersonPlural = suggestion
Std.Usage.GenderedPronouns = suggestion
Std.Usage.GenderedTerms = suggestion

# For more information:
# - Vale documentation: https://vale.sh/docs/
# - Package hub: https://vale.sh/hub/